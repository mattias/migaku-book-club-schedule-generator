<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Club - Reading Schedule Generator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; background-color: #f9f9f9; color: #333; }
        
        h1 { color: #2c3e50; margin: 0 0 1rem 0; font-size: 1.8rem; }
        p { margin-bottom: 1.5rem; }
        /* Justerat grid till 4 kolumner */
        .controls { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 2rem; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
        .full-width { grid-column: 1 / -1; }
        
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; font-size: 0.9rem; color: #555; }
        input, textarea, select { width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; box-sizing: border-box; }
        textarea { height: 150px; font-family: monospace; font-size: 0.9rem; }
        
        button { background-color: #3498db; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-top: 1rem; width: 100%; grid-column: 1 / -1; }
        button:hover { background-color: #2980b9; }
        
        #result-area { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        pre { white-space: pre-wrap; font-family: monospace; font-size: 1rem; color: #2c3e50; margin: 0; }
        
        #speed-input, #chapters-per-week-input, #chars-per-week-target-input, #max-overshoot-input-container { transition: opacity 0.3s, max-height 0.3s; overflow: hidden; }
        .hidden { display: none; }
        
        /* Specific styling for weekly output */
        .weekly-output-group { margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 1px dashed #ccc; }
        .weekly-output-group h4 { margin: 0 0 0.5rem 0; font-size: 1.1rem; color: #2980b9; }
        .weekly-output-group p { margin: 0 0 0.2rem 0; font-size: 0.95rem; }
        .weekly-output-group .total { font-weight: bold; margin-top: 0.5rem; }
        .warning { color: #e74c3c; font-weight: bold; }

    </style>
</head>
<body>

    <h1>📚 Reading Schedule Generator</h1>
    <p>Paste your list (Title newline Cumulative count) below.</p>

    <div class="controls">
        <div>
            <label for="scheduleMode">Schedule Mode:</label>
            <select id="scheduleMode" onchange="toggleInput()">
                <option value="per_day">Characters per Day (split & grouped)</option>
                <option value="per_week_chap">Chapters per Week (fixed chapters)</option>
                <option value="per_week_char">Characters per Week (fixed daily target)</option>
            </select>
        </div>
        
        <div>
            <label for="startDate">Start Date:</label>
            <input type="date" id="startDate">
        </div>

        <div>
            <label for="chapterFormat">Chapter Format:</label>
            <select id="chapterFormat">
                <option value="kanji">Japanese (一章)</option>
                <option value="english">English (ch1)</option>
            </select>
        </div>
        
        <div></div>

        <div id="speed-input">
            <label for="speed">Characters per day target:</label>
            <input type="number" id="speed" value="3500" step="100">
        </div>

        <div id="chapters-per-week-input" style="display: none;">
            <label for="chaptersPerWeek">Chapters per Week:</label>
            <input type="number" id="chaptersPerWeek" value="5" min="1">
        </div>
        
        <div id="chars-per-week-target-input" style="display: none;">
            <label for="dailyTarget">Daily Character Target:</label>
            <input type="number" id="dailyTarget" value="3200" step="100">
        </div>
        
        <div id="max-overshoot-input-container" style="display: none;">
            <label for="maxOvershoot">Max Daily Overshoot (chars):</label>
            <input type="number" id="maxOvershoot" value="500" min="0" step="100">
        </div>

        <div class="full-width">
            <label for="rawInput">Raw Data (Title + Cumulative Count):</label>
            <textarea id="rawInput" placeholder="表紙
0
プロローグ
252
..."></textarea>
        </div>
        
        <button onclick="generateSchedule()">Generate Schedule</button>
    </div>

    <div id="result-area" class="hidden">
        <h3>Result:</h3>
        <pre id="output"></pre>
    </div>

    <script>
        // Set today's date as default
        document.getElementById('startDate').valueAsDate = new Date();

        function toggleInput() {
            const mode = document.getElementById('scheduleMode').value;
            
            document.getElementById('speed-input').style.display = (mode === 'per_day') ? 'block' : 'none';
            document.getElementById('chapters-per-week-input').style.display = (mode === 'per_week_chap') ? 'block' : 'none';
            
            // Handle the two inputs for per_week_char mode
            const isPerWeekChar = (mode === 'per_week_char');
            document.getElementById('chars-per-week-target-input').style.display = isPerWeekChar ? 'block' : 'none';
            document.getElementById('max-overshoot-input-container').style.display = isPerWeekChar ? 'block' : 'none';
        }

        // --- Helper Functions ---

        function toKanji(num) {
            const basic = ['','一','二','三','四','五','六','七','八','九','十'];
            if (num <= 10) return basic[num];
            if (num < 20) return '十' + basic[num % 10];
            if (num % 10 === 0) return basic[Math.floor(num/10)] + '十';
            return basic[Math.floor(num/10)] + '十' + basic[num % 10];
        }

        function getChapterPrefix(index) {
            const format = document.getElementById('chapterFormat').value;
            if (format === 'kanji') {
                return toKanji(index) + '章';
            } else {
                return 'ch' + index;
            }
        }

        function formatDate(date) {
            const d = new Date(date);
            const day = d.getDate();
            const month = d.toLocaleString('en-US', { month: 'short' });
            return `${day}. ${month}`;
        }
        
        function getNextDay(date) {
            let nextDay = new Date(date);
            nextDay.setDate(date.getDate() + 1);
            return nextDay;
        }
        
        function getNextWeek(date) {
            let nextWeek = new Date(date);
            nextWeek.setDate(date.getDate() + 7);
            return nextWeek;
        }

        // --- Main Logic ---

        function generateSchedule() {
            const mode = document.getElementById('scheduleMode').value;
            const raw = document.getElementById('rawInput').value.trim();
            const startVal = document.getElementById('startDate').value;
            
            if (!raw || !startVal) {
                alert("Please fill in both the list and start date!");
                return;
            }

            let currentDate = new Date(startVal);
            const lines = raw.split('\n').map(l => l.trim()).filter(l => l !== "");
            
            // 1. Pre-process the Chapter Data
            let chapterData = [];
            let chapterCounter = 1;
            
            for (let i = 0; i < lines.length - 1; i += 2) {
                const title = lines[i];
                const startCount = Number.parseInt(lines[i+1]); 
                
                if (!lines[i+3]) break; 

                const nextCount = Number.parseInt(lines[i+3]);

                if (Number.isNaN(startCount) || Number.isNaN(nextCount)) continue;

                const length = nextCount - startCount;

                if (length < 100) continue; 

                const roundedLength = Math.round(length / 100) * 100;
                
                chapterData.push({
                    index: chapterCounter,
                    title: title,
                    length: length,
                    roundedLength: roundedLength
                });
                chapterCounter++;
            }

            // 2. Generate Output based on Mode
            let outputHtml = ""; 
            
            if (mode === 'per_day') {
                const speed = Number.parseInt(document.getElementById('speed').value) || 3500;
                outputHtml = `<pre>${generatePerDaySchedule(chapterData, currentDate, speed)}</pre>`;
            } else if (mode === 'per_week_chap') {
                const chaptersPerWeek = Number.parseInt(document.getElementById('chaptersPerWeek').value) || 5;
                outputHtml = generatePerWeekScheduleByChapterCount(chapterData, currentDate, chaptersPerWeek);
            } else if (mode === 'per_week_char') {
                const dailyTarget = Number.parseInt(document.getElementById('dailyTarget').value) || 3200;
                const maxOvershoot = Number.parseInt(document.getElementById('maxOvershoot').value) || 500; // NEW
                const weeklyTarget = dailyTarget * 7;
                outputHtml = generatePerWeekScheduleByCharTarget(chapterData, currentDate, dailyTarget, weeklyTarget, maxOvershoot); // NEW
            }

            document.getElementById('output').innerHTML = outputHtml;
            document.getElementById('result-area').classList.remove('hidden');
        }


        /**
         * MODE: Characters per Day (split & grouped)
         * LOGIC: Calculates the days needed for a chapter (splitting if too large). 
         * If the chapter is short (1 day), it looks ahead to group subsequent short chapters 
         * onto the same day, keeping the original date range output format.
         */
        function generatePerDaySchedule(chapterData, currentDate, speed) {
            let output = "";
            let chapterIndex = 0;
            const dailyTarget = speed;
            const maxGroupThreshold = dailyTarget + 500; // Allow slight overshoot for grouping

            while (chapterIndex < chapterData.length) {
                const chap = chapterData[chapterIndex];
                const chapterStartDay = new Date(currentDate);
                let readingLength = chap.roundedLength;
                
                // 1. Calculate days required for this chapter alone (splitting logic)
                let daysRequired = Math.ceil(readingLength / dailyTarget);

                // 2. Grouping Check: Only if the chapter is short (1 day)
                if (daysRequired === 1) {
                    let chaptersToGroup = [chap];
                    let combinedRead = chap.roundedLength;
                    let j = chapterIndex + 1;

                    // Look ahead for subsequent short chapters that fit the day's quota
                    while (j < chapterData.length) {
                        const nextChap = chapterData[j];
                        const tentativeTotal = combinedRead + nextChap.roundedLength;

                        if (tentativeTotal <= maxGroupThreshold) { 
                            // Group if it fits the target + small overshoot
                            chaptersToGroup.push(nextChap);
                            combinedRead = tentativeTotal;
                            j++;
                        } else {
                            break;
                        }
                    }
                    
                    // If we found a group of 2 or more, process them
                    if (chaptersToGroup.length > 1) {
                        // This entire group takes 1 day. Output each chapter with the same date.
                        const dateStr = formatDate(currentDate);
                        
                        for (const gChap of chaptersToGroup) {
                            const prefix = getChapterPrefix(gChap.index);
                            const separator = (document.getElementById('chapterFormat').value === 'kanji') ? '　' : ' ';
                            // For a 1-day group, dateRange is just the date string
                            output += `${prefix}${separator}${gChap.title} ${dateStr} (~${gChap.roundedLength.toLocaleString()} chars)\n`;
                        }
                        
                        // Update index and date for the next iteration (after the group)
                        chapterIndex += chaptersToGroup.length;
                        currentDate = getNextDay(currentDate);
                        continue; // Skip normal output logic below
                    }
                }
                
                // --- Normal Chapter Logic (Splitting or Single Day, no grouping found) ---
                
                // Calculate chapter end date
                let chapterEndDate = new Date(chapterStartDay);
                chapterEndDate.setDate(chapterStartDay.getDate() + daysRequired - 1);

                const startStr = formatDate(chapterStartDay);
                const endStr = formatDate(chapterEndDate);
                const chapPrefix = getChapterPrefix(chap.index);
                const separator = (document.getElementById('chapterFormat').value === 'kanji') ? '　' : ' ';

                // Output format: Chapter Title Date Range (~Chars)
                let dateRange = (daysRequired <= 1) ? `${startStr}` : `${startStr}-${endStr}`;
                
                output += `${chapPrefix}${separator}${chap.title} ${dateRange} (~${chap.roundedLength.toLocaleString()} chars)\n`;

                // Update date for the next iteration (start date of the next chapter)
                currentDate = getNextDay(chapterEndDate); 
                chapterIndex++; // Move to next chapter
            }
            return output;
        }


        function generatePerWeekScheduleByChapterCount(chapterData, currentDate, chaptersPerWeek) {
            let output = "";
            let weekCount = 1;
            let currentChapterIndex = 0;
            
            while (currentChapterIndex < chapterData.length) {
                const weekStart = new Date(currentDate);
                let weekEnd = new Date(currentDate);
                weekEnd.setDate(currentDate.getDate() + 6);
                
                const currentWeekChapters = chapterData.slice(currentChapterIndex, currentChapterIndex + chaptersPerWeek);
                
                if (currentWeekChapters.length === 0) break;

                let totalWeekChars = 0;
                let chapterList = "";

                for (const chap of currentWeekChapters) {
                    totalWeekChars += chap.roundedLength;
                    const chapPrefix = getChapterPrefix(chap.index);
                    const separator = (document.getElementById('chapterFormat').value === 'kanji') ? '　' : ' ';
                    chapterList += `${chapPrefix}${separator}${chap.title} (~${chap.roundedLength.toLocaleString()} chars)\n`;
                }

                const avgCharsPerDay = Math.round((totalWeekChars / 7) / 100) * 100;
                
                let weekLabel = `WEEK ${weekCount}`;

                output += `<div class="weekly-output-group">`;
                output += `<h4>${weekLabel} (${formatDate(weekStart)} - ${formatDate(weekEnd)})</h4>`;
                output += `<pre>${chapterList}</pre>`;
                output += `<p class="total">total reading: ${totalWeekChars.toLocaleString()} chars ≈ ${avgCharsPerDay.toLocaleString()} chars per day</p>`;
                output += `</div>`;
                
                currentChapterIndex += chaptersPerWeek;
                currentDate = getNextWeek(weekStart); 
                weekCount++;
            }
            return output;
        }

        /**
         * MODE: Characters per Week (fixed daily target)
         * LOGIC: Uses user-defined maxDailyOvershoot to group chapters into weeks.
         */
        function generatePerWeekScheduleByCharTarget(chapterData, currentDate, dailyTarget, weeklyTarget, maxDailyOvershoot) {
            let output = "";
            let weekCount = 1;
            let currentChapterIndex = 0;
            // The calculated maximum daily average allowed for inclusion
            const maxDailyAllowance = dailyTarget + maxDailyOvershoot; 
            
            while (currentChapterIndex < chapterData.length) {
                const weekStart = new Date(currentDate);
                let weekEnd = new Date(currentDate);
                weekEnd.setDate(currentDate.getDate() + 6);
                
                let currentWeekChars = 0;
                let chapterList = "";
                let i = currentChapterIndex;
                let chaptersInWeek = [];
                
                // Group chapters
                while (i < chapterData.length) {
                    const nextChap = chapterData[i];
                    const tentativeTotal = currentWeekChars + nextChap.roundedLength;
                    const tentativeDailyAvg = tentativeTotal / 7;
                    
                    if (currentWeekChars === 0) {
                        // 1. Always include the first chapter
                        chaptersInWeek.push(nextChap);
                        currentWeekChars = tentativeTotal;
                        i++;
                    } else if (i === chapterData.length - 1) {
                        // 2. If it's the last chapter in the book, include it.
                        chaptersInWeek.push(nextChap);
                        currentWeekChars = tentativeTotal;
                        i++;
                        break; // End the week here
                    } else if (tentativeDailyAvg <= maxDailyAllowance) {
                        // 3. Inkludera om den dagliga genomsnittliga läsningen inte överskrider den definierade maxgränsen.
                        chaptersInWeek.push(nextChap);
                        currentWeekChars = tentativeTotal;
                        i++;
                    } else {
                        // 4. The next chapter is too large to be included in this week.
                        break;
                    }
                }
                
                if (chaptersInWeek.length === 0) break;
                
                const daysForThisWeek = 7;
                const finalAvgCharsPerDay = Math.round((currentWeekChars / daysForThisWeek) / 100) * 100;
                
                let weekLabel = `WEEK ${weekCount}`;
                let warningMessage = '';

                // Check for warning (if the final average exceeds the allowed threshold)
                if (finalAvgCharsPerDay > maxDailyAllowance) {
                    // Corrected Swedish warning message
                    warningMessage = `<span class="warning"> (WARNING: Average exceeds your set limit by ${(finalAvgCharsPerDay - dailyTarget).toLocaleString()} chars/day)</span>`;
                }

                // Format final chapter list string
                for (const chap of chaptersInWeek) {
                    const chapPrefix = getChapterPrefix(chap.index);
                    const separator = (document.getElementById('chapterFormat').value === 'kanji') ? '　' : ' ';
                    chapterList += `${chapPrefix}${separator}${chap.title} (~${chap.roundedLength.toLocaleString()} chars)\n`;
                }
                
                // Adjust label for the final week (if it's not a full 7 days)
                if (i >= chapterData.length) {
                    const daysNeeded = Math.ceil(currentWeekChars / dailyTarget); 
                    if (daysNeeded <= 7) {
                        weekEnd = new Date(weekStart);
                        weekEnd.setDate(weekStart.getDate() + Math.max(0, daysNeeded - 1));
                        if (daysNeeded < 7) {
                             weekLabel += ` (book ends)`;
                        }
                    } else {
                        weekEnd = new Date(weekStart);
                        weekEnd.setDate(weekStart.getDate() + Math.max(0, daysNeeded - 1));
                        weekLabel += ` (+ ${daysNeeded - 7} extra days)`;
                    }
                }

                output += `<div class="weekly-output-group">`;
                output += `<h4>${weekLabel} (${formatDate(weekStart)} - ${formatDate(weekEnd)})${warningMessage}</h4>`;
                output += `<pre>${chapterList}</pre>`;
                output += `<p class="total">total reading: ${currentWeekChars.toLocaleString()} chars ≈ ${finalAvgCharsPerDay.toLocaleString()} chars per day</p>`;
                output += `</div>`;

                currentChapterIndex = i; // Move index to the start of the next chapter group
                currentDate = getNextWeek(weekStart); 
                weekCount++;
            }
            return output;
        }

        // Run once on load to set up the default state
        toggleInput();

    </script>
</body>
</html>
